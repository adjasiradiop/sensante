<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SenSante - Pre-diagnostic</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <header class="bg-blue-600 text-white py-4 shadow-lg">
    <div class="max-w-4xl mx-auto px-4">
      <h1 class="text-2xl font-bold">SenSante</h1>
      <p class="text-blue-100 text-sm">Assistant pre-diagnostic médical</p>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <div id="form-section" class="bg-white rounded-xl shadow-md p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-4">Symptômes du patient</h2>

        <div class="mb-3">
          <label class="block text-sm font-medium text-gray-700 mb-1">Âge</label>
          <input type="number" id="age" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ex: 28">
        </div>

        <div class="mb-3">
          <label class="block text-sm font-medium text-gray-700 mb-1">Sexe</label>
          <select id="sexe" class="w-full border border-gray-300 rounded-lg p-2">
            <option value="F">Féminin</option>
            <option value="M">Masculin</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="block text-sm font-medium text-gray-700 mb-1">Température (°C)</label>
          <input type="number" id="temperature" step="0.1" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ex: 38.5">
        </div>

        <div class="mb-3">
          <label class="block text-sm font-medium text-gray-700 mb-1">Tension systolique</label>
          <input type="number" id="tension_sys" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ex: 120">
        </div>

        <div class="mb-3">
          <label class="block text-sm font-medium text-gray-700 mb-2">Symptômes</label>
          <div class="space-y-2">
            <label class="flex items-center"><input type="checkbox" id="toux" class="mr-2"> Toux</label>
            <label class="flex items-center"><input type="checkbox" id="fatigue" class="mr-2"> Fatigue</label>
            <label class="flex items-center"><input type="checkbox" id="maux_tete" class="mr-2"> Maux de tête</label>
            <label class="flex items-center"><input type="checkbox" id="frissons" class="mr-2"> Frissons</label>
            <label class="flex items-center"><input type="checkbox" id="nausee" class="mr-2"> Nausée</label>
          </div>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Région</label>
          <select id="region" class="w-full border border-gray-300 rounded-lg p-2">
            <option value="Dakar">Dakar</option>
            <option value="Diourbel">Diourbel</option>
            <option value="Fatick">Fatick</option>
            <option value="Kaolack">Kaolack</option>
            <option value="Kolda">Kolda</option>
            <option value="Louga">Louga</option>
            <option value="Matam">Matam</option>
            <option value="Saint-Louis">Saint-Louis</option>
            <option value="Thies">Thiès</option>
            <option value="Ziguinchor">Ziguinchor</option>
          </select>
        </div>

        <button onclick="diagnostiquer()" id="btn-diag" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 shadow-md transition">
          Diagnostiquer
        </button>

        <div id="error-box" class="hidden mt-3 bg-red-50 border border-red-300 text-red-700 rounded-lg p-3 text-sm"></div>
      </div>

      <div id="result-section">
        <div class="bg-white rounded-xl shadow-md p-6 text-center text-gray-400">
          <p class="text-4xl mb-3">🩺</p>
          <p>Remplissez le formulaire pour voir le diagnostic.</p>
        </div>
      </div>

    </div>
  </main>

  <footer class="text-center text-gray-400 text-sm py-4">
    SenSante v0.4 - ESP/UCAD - L2 GLSI 2026
  </footer>

  <script>
    // ✅ URL de votre Space Hugging Face
    const API_URL = "https://adjaaaa-sensante.hf.space";

    const icones = {
      "paludisme": "🦟",
      "grippe": "🤧",
      "typhoide": "🤒",
      "sain": "✅"
    };

    const couleurs = {
      "paludisme": { bg: "bg-red-100", text: "text-red-800", bar: "bg-red-500" },
      "grippe": { bg: "bg-orange-100", text: "text-orange-800", bar: "bg-orange-500" },
      "typhoide": { bg: "bg-yellow-100", text: "text-yellow-800", bar: "bg-yellow-500" },
      "sain": { bg: "bg-green-100", text: "text-green-800", bar: "bg-green-500" }
    };

    function showError(msg) {
      const box = document.getElementById("error-box");
      box.textContent = msg;
      box.classList.remove("hidden");
    }

    function hideError() {
      document.getElementById("error-box").classList.add("hidden");
    }

    async function diagnostiquer() {
      hideError();

      const age = document.getElementById("age").value;
      const temperature = document.getElementById("temperature").value;

      if (!age || !temperature) {
        showError("⚠️ Veuillez renseigner au minimum l'âge et la température.");
        return;
      }

      // ✅ Tous les champs requis par l'API
      const patient = {
        age: parseInt(age),
        sexe: document.getElementById("sexe").value,
        temperature: parseFloat(temperature),
        tension_sys: parseInt(document.getElementById("tension_sys").value) || 120,
        toux: document.getElementById("toux").checked,
        fatigue: document.getElementById("fatigue").checked,
        maux_tete: document.getElementById("maux_tete").checked,
        frissons: document.getElementById("frissons").checked,
        nausee: document.getElementById("nausee").checked,
        region: document.getElementById("region").value
      };

      const btn = document.getElementById("btn-diag");
      btn.textContent = "Chargement...";
      btn.disabled = true;

      try {
        const response = await fetch(API_URL + "/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(patient)
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(`Erreur serveur ${response.status} : ${errText}`);
        }

        const resultat = await response.json();
        afficherResultat(resultat);
      } catch (e) {
        console.error(e);
        showError("❌ " + e.message + "\n\nVérifie que le Space Hugging Face est bien démarré.");
      } finally {
        btn.textContent = "Diagnostiquer";
        btn.disabled = false;
      }
    }

    function afficherResultat(r) {
      const key = r.diagnostic.toLowerCase();
      const c = couleurs[key] || couleurs["sain"];
      const ico = icones[key] || "🩺";
      const pct = Math.round(r.probabilite * 100);

      document.getElementById("result-section").innerHTML = `
        <div class="bg-white rounded-xl shadow-md p-6">
          <h2 class="text-xl font-bold text-gray-800 mb-4">Résultat</h2>
          <div class="${c.bg} rounded-lg p-4 mb-4 flex items-center gap-3">
            <span class="text-4xl">${ico}</span>
            <div>
              <p class="text-sm text-gray-600">Diagnostic :</p>
              <p class="text-2xl font-bold ${c.text} uppercase">${r.diagnostic}</p>
            </div>
          </div>
          <div class="mb-4">
            <div class="flex justify-between mb-1">
              <span class="text-sm">Probabilité</span>
              <span class="text-sm font-bold">${pct}%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-3">
              <div class="${c.bar} h-3 rounded-full" style="width: ${pct}%"></div>
            </div>
          </div>
          <p class="text-sm text-gray-600 italic">${r.message}</p>
        </div>`;

      demanderExplication(r);
    }

    async function demanderExplication(diag) {
      const explainData = {
        diagnostic: diag.diagnostic,
        probabilite: diag.probabilite,
        age: parseInt(document.getElementById("age").value),
        sexe: document.getElementById("sexe").value,
        temperature: parseFloat(document.getElementById("temperature").value),
        region: document.getElementById("region").value
      };

      const section = document.getElementById("result-section").querySelector(".bg-white");
      const explDiv = document.createElement("div");
      explDiv.innerHTML = `
        <div class="mt-4 bg-purple-50 rounded-lg p-4 border border-purple-200">
          <p class="text-sm text-purple-600 font-medium mb-1">Explication (Llama 3)</p>
          <p id="expl-text" class="text-gray-500 text-sm animate-pulse">Génération en cours...</p>
        </div>`;
      section.appendChild(explDiv);

      try {
        const response = await fetch(API_URL + "/explain", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(explainData)
        });

        if (!response.ok) throw new Error(`Erreur ${response.status}`);

        const res = await response.json();
        document.getElementById("expl-text").className = "text-gray-700 text-sm leading-relaxed";
        document.getElementById("expl-text").innerText = res.explication;
      } catch (e) {
        document.getElementById("expl-text").innerText = "Explication non disponible. (" + e.message + ")";
      }
    }
  </script>
</body>
</html>
